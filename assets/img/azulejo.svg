<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" fill="#FAF9F6"/>
  <g fill="#1F3F8F">
    <!-- corner rosettes (complete when tiled) -->
    <circle cx="0" cy="0" r="22"/><circle cx="120" cy="0" r="22"/><circle cx="0" cy="120" r="22"/><circle cx="120" cy="120" r="22"/>
    <!-- edge half-medallions -->
    <circle cx="60" cy="0" r="9"/><circle cx="60" cy="120" r="9"/><circle cx="0" cy="60" r="9"/><circle cx="120" cy="60" r="9"/>
    <!-- central star -->
    <path d="M60 30 L67 53 L90 60 L67 67 L60 90 L53 67 L30 60 L53 53 Z"/>
  </g>
  <g fill="#FAF9F6">
    <circle cx="0" cy="0" r="14"/><circle cx="120" cy="0" r="14"/><circle cx="0" cy="120" r="14"/><circle cx="120" cy="120" r="14"/>
    <circle cx="60" cy="60" r="7"/>
  </g>
  <g fill="#E5A73A">
    <circle cx="0" cy="0" r="7"/><circle cx="120" cy="0" r="7"/><circle cx="0" cy="120" r="7"/><circle cx="120" cy="120" r="7"/>
    <circle cx="60" cy="60" r="3.5"/>
  </g>
  <g fill="none" stroke="#1F3F8F" stroke-width="2.2" stroke-linecap="round">
    <!-- petals reaching from the star toward each corner -->
    <path d="M44 44 Q30 22 22 14 Q40 18 44 44 Z"/>
    <path d="M76 44 Q90 22 98 14 Q80 18 76 44 Z"/>
    <path d="M44 76 Q30 98 22 106 Q40 102 44 76 Z"/>
    <path d="M76 76 Q90 98 98 106 Q80 102 76 76 Z"/>
    <!-- framing arcs between medallions -->
    <path d="M22 36 Q36 36 36 22"/><path d="M98 36 Q84 36 84 22"/>
    <path d="M22 84 Q36 84 36 98"/><path d="M98 84 Q84 84 84 98"/>
  </g>
  <g fill="#1F3F8F">
    <circle cx="60" cy="18" r="2.6"/><circle cx="60" cy="102" r="2.6"/><circle cx="18" cy="60" r="2.6"/><circle cx="102" cy="60" r="2.6"/>
  </g>
</svg>
